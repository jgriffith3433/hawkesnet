<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hawkes Net demo</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #14161b; --muted: #5d6470; --line: #e3e6ea; --accent: #2f6fed; --ok: #16a34a; --warn: #d97706; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101216; --card: #171a20; --ink: #eef0f3; --muted: #9aa1ad; --line: #272b33; --accent: #6c9bff; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; grid-template-columns: 1fr 320px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; } p { margin: 0; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  canvas { width: 100%; aspect-ratio: 16 / 10; display: block; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); touch-action: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; } dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
  ul { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; max-height: 260px; overflow: auto; }
  li { display: flex; gap: 8px; align-items: center; } .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .pill.relay { color: var(--accent); border-color: var(--accent); } .pill.p2p { color: var(--ok); border-color: var(--ok); }
  #log { font: 12px/1.4 ui-monospace, monospace; color: var(--muted); max-height: 140px; overflow: auto; margin-top: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>Hawkes Net</h1>
    <p>Everyone on this page with the same room plays together. Move with the arrow keys or drag. Small rooms go peer to peer; past <span id="p2pmax">8</span> players the room moves to the relay without anyone reconnecting.</p>
    <div class="row" style="margin-top:12px"><canvas id="c" width="960" height="600"></canvas></div>
    <div class="row">
      <button class="primary" id="share">Copy invite link</button>
      <button id="bots">Add 5 bots</button>
      <button id="migrate">Move to the relay</button>
      <button id="leave">Leave</button>
    </div>
  </section>
  <aside class="card">
    <dl>
      <dt>Room</dt><dd id="room"></dd>
      <dt>You</dt><dd id="me">connecting…</dd>
      <dt>Transport</dt><dd><span class="pill" id="transport">…</span></dd>
      <dt>Host</dt><dd id="host"></dd>
      <dt>Round trip</dt><dd id="rtt">–</dd>
      <dt>Down / up</dt><dd id="bw">–</dd>
      <dt>Bots here</dt><dd id="botn">0</dd>
    </dl>
    <ul id="peers"></ul>
    <div id="log"></div>
  </aside>
</main>
<script type="module">
  import { join } from '/sdk/hawkes-net.mjs';
  const q = new URLSearchParams(location.search);
  const room = q.get('room') || `demo-${Math.random().toString(36).slice(2, 7)}`;
  if (!q.get('room')) history.replaceState(null, '', `?room=${room}${q.get('t') ? `&t=${q.get('t')}` : ''}`);
  const transport = q.get('t') || 'auto';
  const p2pMax = Number(q.get('p2p') || 8);
  const $ = (id) => document.getElementById(id);
  $('room').textContent = room; $('p2pmax').textContent = p2pMax;
  const log = (s) => { const el = $('log'); el.textContent = `${new Date().toLocaleTimeString()} ${s}\n${el.textContent}`.slice(0, 4000); };
  const W = 960, H = 600;
  const pos = { x: 100 + Math.random() * 760, y: 100 + Math.random() * 400 };
  const keys = new Set();
  addEventListener('keydown', (e) => { if (e.key.startsWith('Arrow')) { keys.add(e.key); e.preventDefault(); } });
  addEventListener('keyup', (e) => keys.delete(e.key));
  const cv = $('c'), g = cv.getContext('2d');
  cv.addEventListener('pointermove', (e) => { if (!e.buttons) return; const r = cv.getBoundingClientRect(); pos.x = Math.max(15, Math.min(W - 15, ((e.clientX - r.left) / r.width) * W)); pos.y = Math.max(15, Math.min(H - 15, ((e.clientY - r.top) / r.height) * H)); });
  const config = { p2pMax, maxPlayers: 64, profile: 'light' };
  // Hawkes Studio's playtest bot: a second player in this page (smoke), or real browsers on one ?room= (two-players).
  // On p2p the smoke also moves the room to the relay and checks again. Nothing runs unless a playtest starts.
  let net = null;
  const { installNetPlaytest } = await import('/demo-playtest.mjs');
  const key = (k, ms) => new Promise((r) => { dispatchEvent(new KeyboardEvent('keydown', { key: k })); setTimeout(() => { dispatchEvent(new KeyboardEvent('keyup', { key: k })); r(); }, ms); });
  installNetPlaytest({
    product: 'hawkes-net', where: location.host, ready: () => true, main: () => net,
    openBot: () => join(room, { project: 'netdemo', endpoint: location.origin, transport, name: 'Playtest bot', role: 'player', config, sub: `pt-${Math.random()}`, log: false }),
    drive: async (step) => { await key('ArrowRight', 900); await key('ArrowDown', 700); await step(100); },
    cornerDrive: async () => { await key('ArrowLeft', 4200); await key('ArrowUp', 3000); },
    view: () => window.hawkesNetDemoView,
    myPos: () => [pos.x, 0, pos.y],
    shownPos: (id) => tracks.get(id)?.sample() ?? null,
    botPose: (u) => [200 + 500 * u, 0, 450],
    tolerance: 8,
    extra: async ({ check, main, bot, until, metric, roundTrips }) => {
      metric('p2p', main.transport === 'p2p' ? 1 : 0);
      if (main.transport !== 'p2p') return void (await check('The room is on the relay', async () => `transport ${main.transport}`));
      await check('The peer to peer link opened and the room stayed peer to peer', async () => {
        const ms = await until(() => main.transport !== 'p2p' || main.peers.get(bot.id)?.route === 'direct' || bot.peers.get(main.id)?.route === 'direct', 7000, () => `the WebRTC data channel to open (routes ${main.peers.get(bot.id)?.route}/${bot.peers.get(main.id)?.route}${main.linkFailure || bot.linkFailure ? `, ${main.linkFailure || bot.linkFailure}` : ''})`);
        if (main.transport !== 'p2p') throw new Error(`the room fell to ${main.transport} before a link opened: ${main.linkFailure || bot.linkFailure || 'no reason given'}`);
        metric('linkMs', Math.round(ms));
        return `direct link after ${Math.round(ms)} ms`;
      });
      await check('The room moves from peer to peer to the relay and still works', async () => {
        main.migrate('playtest');
        const ms = await until(() => main.transport === 'relay' && bot.transport === 'relay' && main.peers.has(bot.id), 15000, () => `both players on the relay (now ${main.transport} / ${bot.transport})`);
        metric('migrateMs', Math.round(ms));
        const rtt = await roundTrips(main, 'main', bot.id);
        metric('relayRttMs', rtt);
        return `moved in ${Math.round(ms)} ms, round trip ${rtt} ms`;
      });
    },
  });
  net = await join(room, { project: 'netdemo', endpoint: location.origin, transport, name: q.get('name') || `Guest ${Math.floor(Math.random() * 900 + 100)}`, config });
  window.hawkesNetDemo = net;
  log(`joined as ${net.id} (${net.transport})`);
  // One short sentence in the log; the ICE/data channel detail (net.linkFailure) is already in the console (the SDK warns) and is repeated there.
  net.when('transport', (e) => {
    if (e.why === 'links failed') { log("Couldn't connect directly, switched to relay"); console.info('[hawkes-net demo] direct link failed:', net.linkFailure || 'no reason given'); }
    else log(`room moved: ${e.from} -> ${e.to} (${e.why})`);
  });
  net.when('peer:join', (p) => log(`${p.name || p.id} joined`));
  net.when('peer:leave', (e) => log(`${e.peer.name || e.peer.id} left (${e.reason})`));
  net.when('host', (e) => log(`host is now ${e.host}`));
  net.when('problem', (e) => log(`problem: ${e.code} ${e.detail}`));
  const tracks = new Map();
  net.onPose((id, s, at) => { let t = tracks.get(id); if (!t) tracks.set(id, (t = net.sync.track({ pos: [0, 1, 2] }))); t.push(at, [s.p[0], s.p[1], s.p[2]], id); });
  // Bots: more players in this page (no singleton), wandering.
  const bots = [];
  $('bots').onclick = async () => {
    for (let i = 0; i < 5; i++) {
      const b = await join(room, { project: 'netdemo', endpoint: location.origin, transport, name: `Bot ${bots.length + 1}`, role: 'player', config, leaveOnHide: true, sub: `bot-${Math.random()}` });
      bots.push({ net: b, x: Math.random() * W, y: Math.random() * H, a: Math.random() * 6.28 });
      $('botn').textContent = bots.length;
    }
  };
  $('migrate').onclick = () => net.migrate('game asked');
  $('leave').onclick = async () => { for (const b of bots) await b.net.leave(); await net.leave(); log('left'); };
  $('share').onclick = () => { navigator.clipboard?.writeText(location.href); $('share').textContent = 'Copied'; setTimeout(() => ($('share').textContent = 'Copy invite link'), 1500); };
  // Everyone is drawn inside the arena: dots clamped to it, overlapping dots pushed apart (the local player stays where it is),
  // and each name placed above or below its dot so it is never clipped at an edge or drawn over another name or dot.
  const PAD = 4, LABEL_H = 17, MIN_GAP = 4;
  const clampXY = (it) => { it.x = Math.max(it.r + PAD, Math.min(W - it.r - PAD, it.x)); it.y = Math.max(it.r + PAD, Math.min(H - it.r - PAD, it.y)); };
  function layout() {
    const items = [{ id: net.id, me: true, x: pos.x, y: pos.y, r: 11, color: net.color || '#2f6fed', text: net.name || 'You' }];
    for (const [id, tr] of tracks) {
      const pr = net.peers.get(id);
      if (!pr) { tracks.delete(id); continue; }
      const s = tr.sample();
      if (!s) continue;
      items.push({ id, me: false, x: s[0], y: s[2], r: 9, color: pr.color || '#888', text: pr.name || id });
    }
    items.sort((a, b) => (a.me ? -1 : b.me ? 1 : a.id < b.id ? -1 : 1));
    items.forEach(clampXY);
    for (let pass = 0; pass < 8; pass++) {
      for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j], min = a.r + b.r + MIN_GAP;
        let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d >= min) continue;
        if (d < 0.01) { const ang = j * 2.4; dx = Math.cos(ang); dy = Math.sin(ang); d = 1; }
        const push = (min - d) / (a.me ? 1 : 2);
        const ux = dx / d, uy = dy / d;
        if (!a.me) { a.x -= ux * push; a.y -= uy * push; }
        b.x += ux * push; b.y += uy * push;
        clampXY(a); clampXY(b);
      }
    }
    const placed = [];
    for (const it of items) {
      let text = it.text;
      while (text.length > 3 && g.measureText(text).width > 150) text = `${text.slice(0, -2)}…`;
      it.text = text;
      const w = g.measureText(text).width + 6, h = LABEL_H;
      const bases = [it.y - it.r - 5, it.y + it.r + 14, it.y - it.r - 5 - h, it.y + it.r + 14 + h];
      let best = null, bestScore = Infinity;
      for (const base of bases) {
        const cx = Math.max(PAD + w / 2, Math.min(W - PAD - w / 2, it.x));
        const top = Math.max(PAD, Math.min(H - PAD - h, base - 13));
        const box = { x: cx, base: top + 13, top, w, h };
        const hit = (l, r2) => !(box.x - w / 2 >= l.x + l.w / 2 || box.x + w / 2 <= l.x - l.w / 2 || box.top >= l.top + l.h || box.top + h <= l.top);
        let score = 0;
        for (const l of placed) if (hit(l)) score += 100;
        for (const o2 of items) {
          const nx = Math.max(box.x - w / 2, Math.min(o2.x, box.x + w / 2)), ny = Math.max(box.top, Math.min(o2.y, box.top + h));
          if (Math.hypot(o2.x - nx, o2.y - ny) < o2.r) score += 50;
        }
        score += bases.indexOf(base);
        if (score < bestScore) { bestScore = score; best = box; }
        if (score < 4) break;
      }
      it.label = best; placed.push(best);
    }
    return items;
  }
  let last = performance.now(), lastStats = { d: 0, u: 0, t: performance.now() };
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const sp = 260 * dt;
    if (keys.has('ArrowLeft')) pos.x -= sp; if (keys.has('ArrowRight')) pos.x += sp; if (keys.has('ArrowUp')) pos.y -= sp; if (keys.has('ArrowDown')) pos.y += sp;
    pos.x = Math.max(15, Math.min(W - 15, pos.x)); pos.y = Math.max(15, Math.min(H - 15, pos.y));
    net.pose([pos.x, 0, pos.y], 0);
    for (const b of bots) { b.a += (Math.random() - 0.5) * 0.3; b.x += Math.cos(b.a) * 120 * dt; b.y += Math.sin(b.a) * 120 * dt; if (b.x < 10 || b.x > W - 10) b.a = Math.PI - b.a; if (b.y < 10 || b.y > H - 10) b.a = -b.a; b.x = Math.max(10, Math.min(W - 10, b.x)); b.y = Math.max(10, Math.min(H - 10, b.y)); b.net.pose([b.x, 0, b.y], 0); }
    g.clearRect(0, 0, W, H);
    g.font = '13px Inter, system-ui, sans-serif'; g.textAlign = 'center';
    const ink = getComputedStyle(document.body).color;
    const items = layout();
    for (const it of items) {
      g.fillStyle = it.color; g.beginPath(); g.arc(it.x, it.y, it.r, 0, 7); g.fill();
      if (it.me) { g.strokeStyle = ink; g.lineWidth = 2; g.stroke(); }
      if (it.label) { g.fillStyle = ink; g.fillText(it.text, it.label.x, it.label.base); }
    }
    window.hawkesNetDemoView = { w: W, h: H, items: items.map((it) => ({ id: it.id, me: it.me, x: it.x, y: it.y, r: it.r, label: it.label && { x: it.label.x - it.label.w / 2, y: it.label.top, w: it.label.w, h: it.label.h, text: it.text } })) };
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setInterval(() => {
    const s = net.stats();
    const t = performance.now(), dts = (t - lastStats.t) / 1000;
    $('bw').textContent = `${((s.downBytes - lastStats.d) / dts / 1024).toFixed(1)} / ${((s.upBytes - lastStats.u) / dts / 1024).toFixed(1)} KB/s`;
    lastStats = { d: s.downBytes, u: s.upBytes, t };
    $('me').textContent = `${net.name} (${net.id})`;
    const tp = $('transport'); tp.textContent = net.transport; tp.className = `pill ${net.transport}`;
    $('host').textContent = net.isHost ? 'you' : (net.peers.get(net.host)?.name || net.host || '–');
    $('rtt').textContent = s.rttMs === null ? (net.isHost && net.transport === 'p2p' ? 'you host' : '–') : `${s.rttMs} ms`;
    $('peers').innerHTML = '';
    for (const p of [...net.peers.values()].sort((a, b) => a.ord - b.ord)) {
      const li = document.createElement('li');
      li.innerHTML = `<span class="dot" style="background:${p.color || '#888'}"></span><span style="flex:1"></span><span class="pill"></span>`;
      li.children[1].textContent = p.name || p.id;
      li.children[2].textContent = net.transport === 'relay' ? 'relay' : p.id === net.host ? 'host' : net.isHost ? (p.route === 'direct' ? 'linked' : 'signal') : p.route; // 'linked' only once the WebRTC channel is open
      $('peers').appendChild(li);
    }
  }, 500);
</script>
</body>
</html>

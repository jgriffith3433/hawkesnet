# Checks a release of the JS SDK (sdk/js, @hawkesgen/net) to jgriffith3433/hawkesnet-js: copies it, commits and tags
# v<version> in the runner with tools/release-js.mjs, and says whether that version is due. It never pushes: no
# personal token is kept for hawkesnet-js. A Claude session with both repos pushes the release itself, no token needed:
#   node tools/release-js.mjs --push      (from a hawkesnet checkout with hawkesnet-js next to it)
#   gh workflow run ops-release-js.yml --repo jgriffith3433/hawkesnet --ref main
name: ops-release-js
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ops-release-js
  cancel-in-progress: false
jobs:
  release:
    name: Release @hawkesgen/net
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: hawkesnet
      - uses: actions/checkout@v4
        with:
          repository: jgriffith3433/hawkesnet-js
          path: hawkesnet-js
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Release
        run: |
          git -C hawkesnet-js config user.name "jgriffith3433"
          git -C hawkesnet-js config user.email "jgriffith3433@users.noreply.github.com"
          v=$(node -p "require('./hawkesnet/sdk/js/package.json').version")
          if [ -n "$(git -C hawkesnet-js tag --list "v$v")" ]; then
            echo "v$v is already released: nothing due." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          node hawkesnet/tools/release-js.mjs
          echo "Due. Push it from a Claude session: node tools/release-js.mjs --push" >> "$GITHUB_STEP_SUMMARY"
